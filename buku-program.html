<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <!-- Kemas kini meta viewport untuk menghalang native zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Program - Karnival Pendidikan Madani</title>
    <link rel="icon" type="image/png" href="icoppdag.png">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Pustaka Page-Flip (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <!-- Pustaka jsPDF (CDN) untuk janaan PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            background-color: #e5e7eb; /* tailwind gray-200 */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Penggayaan khusus untuk halaman buku */
        .page {
            background-color: #ffffff;
            /* Bayang dalaman untuk kesan lipatan buku */
            box-shadow: inset -1px 0 10px rgba(0, 0, 0, 0.1), inset 1px 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .page-cover {
            background-color: #f8fafc;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Boleh tukar ke 'contain' jika imej terherot (distorted) */
            pointer-events: none; /* Elakkan imej diseret */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-gray-800 overscroll-none">

    <!-- Pengepala Navigasi -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between relative">
            
            <a href="index.html" class="flex items-center text-blue-600 hover:text-blue-800 transition-colors font-medium z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1 sm:mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                <span class="hidden sm:inline">Kembali</span>
            </a>
            
            <!-- Tajuk di tengah -->
            <h1 class="text-base sm:text-lg font-bold text-gray-800 absolute left-1/2 transform -translate-x-1/2 whitespace-nowrap hidden sm:block">
                Buku Program KPM 2026
            </h1>
            
            <!-- Ruang Kanan: Zoom & Muat Turun -->
            <div class="flex items-center space-x-2 sm:space-x-4 z-10">
                
                <!-- Kawalan Zoom -->
                <div class="flex items-center space-x-1 sm:space-x-2 bg-gray-200/60 rounded-full p-1 shadow-inner">
                    <button id="btn-zoom-out" class="p-1.5 sm:p-2 rounded-full bg-white text-gray-700 shadow hover:bg-gray-50 transition-colors" title="Kecilkan">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7" />
                        </svg>
                    </button>
                    <span id="zoom-text" class="text-xs sm:text-sm font-bold text-gray-700 w-10 sm:w-12 text-center">100%</span>
                    <button id="btn-zoom-in" class="p-1.5 sm:p-2 rounded-full bg-white text-gray-700 shadow hover:bg-gray-50 transition-colors" title="Besarkan">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
                        </svg>
                    </button>
                </div>

                <!-- Butang Muat Turun -->
                <button id="btn-download-pdf" class="flex items-center justify-center p-1.5 sm:p-2 sm:px-3 rounded-full bg-blue-600 text-white shadow hover:bg-blue-700 transition-colors disabled:opacity-70 disabled:cursor-wait" title="Muat Turun PDF">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span class="hidden sm:inline text-sm font-medium ml-1">Muat Turun</span>
                </button>
                
            </div>
            
        </div>
    </header>

    <!-- Kontena Utama Flipbook -->
    <main id="main-container" class="flex-grow pt-24 pb-28 px-4 overflow-auto w-full text-center touch-pan-x touch-pan-y">
        
        <!-- Pembalut Zoom - Membenarkan skala ke atas/bawah -->
        <div id="zoom-wrapper" class="inline-block transition-transform duration-75 origin-top">
            
            <div id="flip-book" class="flip-book drop-shadow-2xl text-left mx-auto">
                
                <!-- Muka Surat 1 (Kulit Hadapan) -->
                <!-- Tambah crossorigin="anonymous" supaya Canvas tiada isu CORS jika fallback imej digunakan -->
                <div class="page page-cover" data-density="hard">
                    <img src="image/1.png" alt="Muka 1" crossorigin="anonymous" onerror="this.src='https://placehold.co/400x600/png?text=1.png';">
                </div>

                <!-- Muka Surat 2 -->
                <div class="page">
                    <img src="image/2.png" alt="Muka 2" crossorigin="anonymous" onerror="this.src='https://placehold.co/400x600/png?text=2.png';">
                </div>

                <!-- Muka Surat 3 -->
                <div class="page">
                    <img src="image/3.png" alt="Muka 3" crossorigin="anonymous" onerror="this.src='https://placehold.co/400x600/png?text=3.png';">
                </div>

                <!-- Muka Surat 4 -->
                <div class="page">
                    <img src="image/4.png" alt="Muka 4" crossorigin="anonymous" onerror="this.src='https://placehold.co/400x600/png?text=4.png';">
                </div>

                <!-- Muka Surat 5 -->
                <div class="page">
                    <img src="image/5.png" alt="Muka 5" crossorigin="anonymous" onerror="this.src='https://placehold.co/400x600/png?text=5.png';">
                </div>

                <!-- Muka Surat 6 -->
                <div class="page">
                    <img src="image/6.png" alt="Muka 6" crossorigin="anonymous" onerror="this.src='https://placehold.co/400x600/png?text=6.png';">
                </div>

                <!-- Muka Surat 7 -->
                <div class="page">
                    <img src="image/7.png" alt="Muka 7" crossorigin="anonymous" onerror="this.src='https://placehold.co/400x600/png?text=7.png';">
                </div>

                <!-- Muka Surat 8 (Kulit Belakang) -->
                <div class="page page-cover" data-density="hard">
                    <img src="image/8.png" alt="Muka 8" crossorigin="anonymous" onerror="this.src='https://placehold.co/400x600/png?text=8.png';">
                </div>
                
            </div>
            
        </div>

    </main>

    <!-- Bar Kawalan (Bawah) -->
    <footer class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 py-3 z-50">
        <div class="max-w-md mx-auto flex items-center justify-between px-6">
            
            <button id="btn-prev" class="p-2 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            
            <div class="text-sm font-medium text-gray-600">
                Muka surat <span id="page-current" class="text-blue-700 font-bold">1</span> dari <span id="page-total">8</span>
            </div>
            
            <button id="btn-next" class="p-2 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </button>

        </div>
    </footer>

    <!-- Logik Inisialisasi Flipbook, Butang Zoom & PDF -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // ----------------------------------------------------
            // 1. Konfigurasi Asas Flipbook
            // ----------------------------------------------------
            const pageFlip = new St.PageFlip(
                document.getElementById('flip-book'),
                {
                    width: 400, // Lebar asas (Potret)
                    height: 565, // Tinggi asas (Nisbah ~A4)
                    size: "stretch", // 'stretch' membenarkan saiz berubah mengikut skrin
                    minWidth: 300,
                    maxWidth: 800,
                    minHeight: 400,
                    maxHeight: 1130,
                    maxShadowOpacity: 0.5,
                    showCover: true, // Kulit hadapan dan belakang
                    mobileScrollSupport: false, // Diset false untuk membenarkan touch gesture tersuai tanpa pertembungan
                    usePortrait: true // Membenarkan mod 1 muka surat di telefon
                }
            );

            // Muatkan elemen .page dari HTML
            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            // Elemen DOM untuk kawalan muka surat
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const pageCurrent = document.getElementById('page-current');
            const pageTotal = document.getElementById('page-total');

            // Set jumlah muka surat
            pageTotal.innerText = pageFlip.getPageCount();

            // Kawalan Butang Selak
            btnPrev.addEventListener('click', () => {
                pageFlip.flipPrev();
            });

            btnNext.addEventListener('click', () => {
                pageFlip.flipNext();
            });

            // Acara (Event) apabila muka surat diselak
            pageFlip.on('flip', (e) => {
                let currentPage = e.data + 1;
                pageCurrent.innerText = currentPage;

                btnPrev.disabled = (currentPage === 1);
                btnNext.disabled = (currentPage >= pageFlip.getPageCount());
            });

            // Set awal status butang Prev
            btnPrev.disabled = true;

            // ----------------------------------------------------
            // 2. Konfigurasi Zoom (Butang & Pinch)
            // ----------------------------------------------------
            const mainContainer = document.getElementById('main-container');
            const zoomWrapper = document.getElementById('zoom-wrapper');
            const btnZoomIn = document.getElementById('btn-zoom-in');
            const btnZoomOut = document.getElementById('btn-zoom-out');
            const zoomText = document.getElementById('zoom-text');

            let currentZoom = 1.0;
            const ZOOM_STEP = 0.25; // Skala kenaikan butang
            const MAX_ZOOM = 3.0;   // Had maksimum (300%)
            const MIN_ZOOM = 0.5;   // Had minimum (50%)

            function updateZoomDisplay() {
                zoomWrapper.style.transform = `scale(${currentZoom})`;
                zoomText.innerText = Math.round(currentZoom * 100) + '%';
            }

            btnZoomIn.addEventListener('click', () => {
                if (currentZoom < MAX_ZOOM) {
                    currentZoom += ZOOM_STEP;
                    if (currentZoom > MAX_ZOOM) currentZoom = MAX_ZOOM;
                    updateZoomDisplay();
                }
            });

            btnZoomOut.addEventListener('click', () => {
                if (currentZoom > MIN_ZOOM) {
                    currentZoom -= ZOOM_STEP;
                    if (currentZoom < MIN_ZOOM) currentZoom = MIN_ZOOM;
                    updateZoomDisplay();
                }
            });

            // ----------------------------------------------------
            // 3. Logik Pinch-to-Zoom (Sentuhan Berbilang Jari)
            // ----------------------------------------------------
            let initialPinchDistance = null;
            let initialZoomLevel = 1.0;

            function getDistanceBetweenTouches(e) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                return Math.sqrt(
                    Math.pow(touch2.clientX - touch1.clientX, 2) + 
                    Math.pow(touch2.clientY - touch1.clientY, 2)
                );
            }

            mainContainer.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    initialPinchDistance = getDistanceBetweenTouches(e);
                    initialZoomLevel = currentZoom;
                }
            }, { passive: false });

            mainContainer.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDistance !== null) {
                    e.preventDefault(); 
                    const currentDistance = getDistanceBetweenTouches(e);
                    const scaleFactor = currentDistance / initialPinchDistance;
                    
                    let newZoom = initialZoomLevel * scaleFactor;
                    if (newZoom < MIN_ZOOM) newZoom = MIN_ZOOM;
                    if (newZoom > MAX_ZOOM) newZoom = MAX_ZOOM;
                    
                    currentZoom = newZoom;
                    updateZoomDisplay();
                }
            }, { passive: false });

            mainContainer.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
            });

            // ----------------------------------------------------
            // 4. Logik Muat Turun PDF (jsPDF)
            // ----------------------------------------------------
            const btnDownloadPdf = document.getElementById('btn-download-pdf');
            
            btnDownloadPdf.addEventListener('click', async () => {
                
                // Simpan kandungan butang asal & ubah ke status loading
                const originalHtml = btnDownloadPdf.innerHTML;
                btnDownloadPdf.disabled = true;
                btnDownloadPdf.innerHTML = `
                    <svg class="animate-spin h-4 w-4 sm:h-5 sm:w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="hidden sm:inline text-sm font-medium ml-1">Menjana...</span>
                `;

                try {
                    // Beri pelayar masa untuk mengemaskini DOM (loading state)
                    await new Promise(resolve => setTimeout(resolve, 50)); 
                    
                    const { jsPDF } = window.jspdf;
                    // Format A4, orientasi potret
                    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    
                    const images = document.querySelectorAll('.page img');
                    const A4_WIDTH = 210;
                    const A4_HEIGHT = 297;

                    for (let i = 0; i < images.length; i++) {
                        const img = images[i];
                        
                        // Tambah mukasurat baru jika lebih dari 1 gambar
                        if (i > 0) {
                            doc.addPage();
                        }
                        
                        // Menggunakan canvas untuk mengekstrak data imej secara konsisten
                        // Memastikan format sentiasa disokong tanpa mengira format asal imej (png, webp, dll)
                        const canvas = document.createElement('canvas');
                        // Lebar default jika imej gagal muat (menggunakan saiz fallback jsPDF)
                        canvas.width = img.naturalWidth || 800; 
                        canvas.height = img.naturalHeight || 1130;
                        
                        const ctx = canvas.getContext('2d');
                        // Latar putih
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        // Lukis imej
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // Ekstrak sebagai JPEG (mengurangkan saiz fail berbanding PNG)
                        const imgData = canvas.toDataURL('image/jpeg', 0.9);
                        
                        // Tambah ke PDF mengikut ukuran penuh A4
                        doc.addImage(imgData, 'JPEG', 0, 0, A4_WIDTH, A4_HEIGHT);
                    }
                    
                    // Muat turun fail PDF
                    doc.save('Buku_Program_KPM_2026.pdf');
                    
                } catch (error) {
                    console.error("Ralat penjanaan PDF:", error);
                    alert("Maaf, ralat berlaku semasa menjana PDF. Sila pastikan sambungan internet stabil atau muat semula halaman.");
                } finally {
                    // Kembalikan status butang asal
                    btnDownloadPdf.innerHTML = originalHtml;
                    btnDownloadPdf.disabled = false;
                }
            });

        });
    </script>
</body>
</html>
