<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Program - Karnival Pendidikan Madani</title>
    <link rel="icon" type="image/png" href="icoppdag.png">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Pustaka Page-Flip (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        body {
            background-color: #e5e7eb; /* tailwind gray-200 */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Penggayaan khusus untuk halaman buku */
        .page {
            background-color: #ffffff;
            /* Bayang dalaman untuk kesan lipatan buku */
            box-shadow: inset -1px 0 10px rgba(0, 0, 0, 0.1), inset 1px 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .page-cover {
            background-color: #f8fafc;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Boleh tukar ke 'contain' jika imej terherot (distorted) */
            pointer-events: none; /* Elakkan imej diseret */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-gray-800">

    <!-- Pengepala Navigasi -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between relative">
            
            <a href="index.html" class="flex items-center text-blue-600 hover:text-blue-800 transition-colors font-medium z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1 sm:mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                <span class="hidden sm:inline">Kembali</span>
            </a>
            
            <!-- Tajuk di tengah -->
            <h1 class="text-base sm:text-lg font-bold text-gray-800 absolute left-1/2 transform -translate-x-1/2 whitespace-nowrap hidden sm:block">
                Buku Program KPM 2026
            </h1>
            
            <!-- Kawalan Zoom -->
            <div class="flex items-center space-x-1 sm:space-x-2 bg-gray-200/60 rounded-full p-1 shadow-inner z-10">
                <button id="btn-zoom-out" class="p-1.5 sm:p-2 rounded-full bg-white text-gray-700 shadow hover:bg-gray-50 transition-colors" title="Kecilkan">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7" />
                    </svg>
                </button>
                <span id="zoom-text" class="text-xs sm:text-sm font-bold text-gray-700 w-10 sm:w-12 text-center">100%</span>
                <button id="btn-zoom-in" class="p-1.5 sm:p-2 rounded-full bg-white text-gray-700 shadow hover:bg-gray-50 transition-colors" title="Besarkan">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
                    </svg>
                </button>
            </div>
            
        </div>
    </header>

    <!-- Kontena Utama Flipbook -->
    <main class="flex-grow pt-24 pb-28 px-4 overflow-auto w-full text-center">
        
        <!-- Pembalut Zoom - Membenarkan skala ke atas/bawah -->
        <div id="zoom-wrapper" class="inline-block transition-transform duration-300 origin-top">
            
            <div id="flip-book" class="flip-book drop-shadow-2xl text-left mx-auto">
                
                <!-- Muka Surat 1 (Kulit Hadapan) -->
                <div class="page page-cover" data-density="hard">
                    <img src="image/1.png" alt="Muka 1" onerror="this.src='https://placehold.co/400x600/png?text=1.png';">
                </div>

                <!-- Muka Surat 2 -->
                <div class="page">
                    <img src="image/2.png" alt="Muka 2" onerror="this.src='https://placehold.co/400x600/png?text=2.png';">
                </div>

                <!-- Muka Surat 3 -->
                <div class="page">
                    <img src="image/3.png" alt="Muka 3" onerror="this.src='https://placehold.co/400x600/png?text=3.png';">
                </div>

                <!-- Muka Surat 4 -->
                <div class="page">
                    <img src="image/4.png" alt="Muka 4" onerror="this.src='https://placehold.co/400x600/png?text=4.png';">
                </div>

                <!-- Muka Surat 5 -->
                <div class="page">
                    <img src="image/5.png" alt="Muka 5" onerror="this.src='https://placehold.co/400x600/png?text=5.png';">
                </div>

                <!-- Muka Surat 6 -->
                <div class="page">
                    <img src="image/6.png" alt="Muka 6" onerror="this.src='https://placehold.co/400x600/png?text=6.png';">
                </div>

                <!-- Muka Surat 7 -->
                <div class="page">
                    <img src="image/7.png" alt="Muka 7" onerror="this.src='https://placehold.co/400x600/png?text=7.png';">
                </div>

                <!-- Muka Surat 8 (Kulit Belakang) -->
                <div class="page page-cover" data-density="hard">
                    <img src="image/8.png" alt="Muka 8" onerror="this.src='https://placehold.co/400x600/png?text=8.png';">
                </div>
                
            </div>
            
        </div>

    </main>

    <!-- Bar Kawalan (Bawah) -->
    <footer class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 py-3 z-50">
        <div class="max-w-md mx-auto flex items-center justify-between px-6">
            
            <button id="btn-prev" class="p-2 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            
            <div class="text-sm font-medium text-gray-600">
                Muka surat <span id="page-current" class="text-blue-700 font-bold">1</span> dari <span id="page-total">8</span>
            </div>
            
            <button id="btn-next" class="p-2 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </button>

        </div>
    </footer>

    <!-- Logik Inisialisasi Flipbook & Zoom -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // ----------------------------------------------------
            // 1. Konfigurasi Asas Flipbook
            // ----------------------------------------------------
            const pageFlip = new St.PageFlip(
                document.getElementById('flip-book'),
                {
                    width: 400, // Lebar asas (Potret)
                    height: 565, // Tinggi asas (Nisbah ~A4)
                    size: "stretch", // 'stretch' membenarkan saiz berubah mengikut skrin
                    minWidth: 300,
                    maxWidth: 800,
                    minHeight: 400,
                    maxHeight: 1130,
                    maxShadowOpacity: 0.5,
                    showCover: true, // Kulit hadapan dan belakang
                    mobileScrollSupport: false, // Memudahkan "swipe" pada peranti mudah alih
                    usePortrait: true // Membenarkan mod 1 muka surat di telefon
                }
            );

            // Muatkan elemen .page dari HTML
            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            // Elemen DOM untuk kawalan muka surat
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const pageCurrent = document.getElementById('page-current');
            const pageTotal = document.getElementById('page-total');

            // Set jumlah muka surat
            pageTotal.innerText = pageFlip.getPageCount();

            // Kawalan Butang Selak
            btnPrev.addEventListener('click', () => {
                pageFlip.flipPrev();
            });

            btnNext.addEventListener('click', () => {
                pageFlip.flipNext();
            });

            // Acara (Event) apabila muka surat diselak
            pageFlip.on('flip', (e) => {
                let currentPage = e.data + 1;
                pageCurrent.innerText = currentPage;

                btnPrev.disabled = (currentPage === 1);
                btnNext.disabled = (currentPage >= pageFlip.getPageCount());
            });

            // Set awal status butang Prev
            btnPrev.disabled = true;

            // ----------------------------------------------------
            // 2. Konfigurasi Zoom
            // ----------------------------------------------------
            const zoomWrapper = document.getElementById('zoom-wrapper');
            const btnZoomIn = document.getElementById('btn-zoom-in');
            const btnZoomOut = document.getElementById('btn-zoom-out');
            const zoomText = document.getElementById('zoom-text');

            let currentZoom = 1.0;
            const ZOOM_STEP = 0.25; // Skala kenaikan
            const MAX_ZOOM = 2.5;   // Had maksimum (250%)
            const MIN_ZOOM = 0.5;   // Had minimum (50%)

            function updateZoomDisplay() {
                // Terapkan transformasi skala pada kontena
                zoomWrapper.style.transform = `scale(${currentZoom})`;
                // Kemas kini teks peratusan
                zoomText.innerText = Math.round(currentZoom * 100) + '%';
            }

            btnZoomIn.addEventListener('click', () => {
                if (currentZoom < MAX_ZOOM) {
                    currentZoom += ZOOM_STEP;
                    updateZoomDisplay();
                }
            });

            btnZoomOut.addEventListener('click', () => {
                if (currentZoom > MIN_ZOOM) {
                    currentZoom -= ZOOM_STEP;
                    updateZoomDisplay();
                }
            });

        });
    </script>
</body>
</html>
