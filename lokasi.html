<!DOCTYPE html>
<html lang="ms">
<head>
    <!-- STREAMING_CHUNK:Konfigurasi awal HTML dan meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Peta Lokasi Karnival - KPM 2026</title>
    
    <!-- Pemuatan Tailwind CSS melalui CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Pemuatan SweetAlert2 untuk paparan pop-up interaktif -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>

    <style>
        /* STREAMING_CHUNK:Penggayaan tambahan tersuai */
        /* Animasi kerdipan (pulse) tersuai untuk menarik perhatian kepada penanda (marker) */
        @keyframes markerPulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        
        .marker-btn {
            animation: markerPulse 2s infinite;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Class untuk menyembunyikan penanda dengan kemas */
        .marker-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Memastikan peta boleh diskrol (panning) jika di-zoom di telefon pintar */
        .map-wrapper {
            touch-action: pan-x pan-y;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

    <!-- STREAMING_CHUNK:Pengepala dan Navigasi Utama -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between relative">

                </svg>
                <span>Kembali</span>
            </a>
            
            <h1 class="text-lg font-bold text-slate-800 absolute left-1/2 transform -translate-x-1/2 whitespace-nowrap hidden sm:block">
                Peta Lokasi Karnival
            </h1>
            
            <!-- Tempat letak kosong di kanan untuk mengimbangi ruang tajuk di tengah -->
            <div class="w-24"></div>
        </div>
    </header>

    <!-- STREAMING_CHUNK:Kawasan Peta Interaktif -->
    <main class="flex-grow flex items-start justify-center p-2 sm:p-6 lg:p-8 map-wrapper overflow-auto">
        
        <div class="bg-white p-2 sm:p-4 rounded-xl shadow-lg border border-slate-200 w-full max-w-5xl">
            
            <div class="mb-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 sm:hidden">Peta Lokasi Karnival</h2>
                    <p class="text-sm text-slate-500 mt-1">Ketik pada nombor lokasi di peta untuk info acara.</p>
                </div>
                
                <!-- Butang Togel Penanda (Sembunyi/Papar) -->
                <button id="btn-toggle-markers" onclick="togelPenanda()" class="flex items-center justify-center gap-2 bg-slate-800 text-white text-sm font-medium py-2 px-4 rounded-lg hover:bg-slate-700 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-1 w-full sm:w-auto">
                    <svg id="icon-hide" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    </svg>
                    <svg id="icon-show" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <span id="teks-toggle">Sembunyi Penanda</span>
                </button>
            </div>

            <!-- Kontena Peta dengan kedudukan relatif (relative) -->
            <div class="relative w-full h-auto overflow-hidden rounded-lg bg-slate-100 shadow-inner">
                
                <!-- Imej Peta Asas (Telah disahkan src="peta.png") -->
                <img src="peta.png" alt="Pelan Induk Lokasi Karnival" class="w-full h-auto block select-none pointer-events-none" id="img-map">
                
                <!-- Penanda 1: Dewan Alamanda -->
                <button onclick="paparMaklumat(1)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 28%; top: 40%;" title="Dewan Alamanda">
                    1
                </button>

                <!-- Penanda 2: Padang Sekolah -->
                <button onclick="paparMaklumat(2)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 75%; top: 60%;" title="Padang Sekolah">
                    2
                </button>

                <!-- Penanda 3: Dewan Datuk Dr Haji Ihsan -->
                <button onclick="paparMaklumat(3)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 15%; top: 55%;" title="Dewan Datuk Dr Haji Ihsan">
                    3
                </button>

                <!-- Penanda 4: Dewan Lavender -->
                <button onclick="paparMaklumat(4)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 33%; top: 17%;" title="Dewan Lavender">
                    4
                </button>

                <!-- Penanda 5: Kelas 5 Ekonomi & 5 Prinsip Akaun -->
                <button onclick="paparMaklumat(5)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 39%; top: 13%;" title="Kelas 5 Ekonomi & 5 Prinsip Akaun">
                    5
                </button>

                <!-- Penanda 6: Padang Mini -->
                <button onclick="paparMaklumat(6)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 30%; top: 54%;" title="Padang Mini">
                    6
                </button>

                <!-- Penanda 7: Kelas Tingkatan 1 -->
                <button onclick="paparMaklumat(7)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 23%; top: 64%;" title="Kelas Tingkatan 1">
                    7
                </button>

                <!-- Penanda 8: Perpustakaan & Google Classroom -->
                <button onclick="paparMaklumat(8)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 46%; top: 20%;" title="Perpustakaan & Google Classroom">
                    8
                </button>

                <!-- Penanda 9: Makmal Bestari 3 dan 4 -->
                <button onclick="paparMaklumat(9)" class="absolute w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full bg-blue-600 text-white text-xs sm:text-sm font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer shadow-md hover:bg-blue-700 transition-transform hover:scale-110 z-10 marker-btn" style="left: 37%; top: 7%;" title="Makmal Bestari 3 dan 4">
                    9
                </button>
            </div>
            
            <!-- Ruang Petunjuk (Legend) Ringkas di Bawah -->
            <div class="mt-6 border-t border-slate-100 pt-4">
                <h3 class="text-sm font-semibold text-slate-700 mb-3">Senarai Lokasi Interaktif:</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-xs text-slate-700">
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(1)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">1</span> <span>Dewan Alamanda</span></button>
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(2)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">2</span> <span>Padang Sekolah</span></button>
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(3)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">3</span> <span>Dewan Datuk Dr Haji Ihsan</span></button>
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(4)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">4</span> <span>Dewan Lavender</span></button>
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(5)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">5</span> <span>Kelas 5 Ekonomi & Prinsip Akaun</span></button>
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(6)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">6</span> <span>Padang Mini</span></button>
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(7)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">7</span> <span>Kelas Tingkatan 1</span></button>
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(8)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">8</span> <span>Perpustakaan & GC</span></button>
                    <button class="flex items-center gap-2 hover:bg-blue-50 p-1.5 rounded transition-colors text-left" onclick="paparMaklumat(9)"><span class="w-5 h-5 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">9</span> <span>Makmal Bestari 3 dan 4</span></button>
                </div>
            </div>

        </div>
    </main>

    <!-- STREAMING_CHUNK:Logik Aplikasi JavaScript -->
    <script>
        // -------------------------------------------------------------------
        // 1. DATA PANGKALAN LOKASI (Statik)
        // -------------------------------------------------------------------
        const pangkalanDataLokasi = {
            1: {
                nama: "Dewan Alamanda",
                ikon: "🏛️",
                acara: [
                    "Pertandingan Busana Tradisional",
                    "Pertandingan Nyanyian Lagu Patriotik",
                    "Pameran PPD, Agensi, Rakan Strategik & Sekolah",
                    "Majlis Perasmian Penutup"
                ]
            },
            2: {
                nama: "Padang Sekolah",
                ikon: "🏟️",
                acara: [
                    "Senamrobik MADANI"
                ]
            },
            3: {
                nama: "Dewan Datuk Dr Haji Ihsan",
                ikon: "🏢",
                acara: [
                    "Slot NADI Negara",
                    "Slot TEKAD Pendidikan Malaysia"
                ]
            },
            4: {
                nama: "Dewan Lavender",
                ikon: "🏫",
                acara: [
                    "Pertandingan Mewarna Sekolah Rendah",
                    "Pertandingan Doodle Art Sekolah Menengah"
                ]
            },
            5: {
                nama: "Kelas 5 Ekonomi & 5 Prinsip Akaun",
                ikon: "📚",
                acara: [
                    "Pertandingan Cup Stacking Rendah & Menengah"
                ]
            },
            6: {
                nama: "Padang Mini",
                ikon: "⚽",
                acara: [
                    "Penalty & Netball Shoot-Out"
                ]
            },
            7: {
                nama: "Kelas Tingkatan 1",
                ikon: "🏫",
                acara: [
                    "Pertandingan Poster Kajian Tindakan & Inovasi"
                ]
            },
            8: {
                nama: "Perpustakaan & Google Classroom",
                ikon: "📖",
                acara: [
                    "Pembentangan Kajian Tindakan & Inovasi"
                ]
            },
            9: {
                nama: "Makmal Bestari 3 dan 4",
                ikon: "💻",
                acara: [
                    "Pembentangan Kajian Tindakan & Inovasi (Makmal Bestari 3, tingkat bawah)",
                    "Bengkel Advance AI (Makmal Bestari 4, tingkat atas)"
                ]
            }
        };

        // -------------------------------------------------------------------
        // 2. FUNGSI TOGEL PENANDA (Sembunyi / Papar)
        // -------------------------------------------------------------------
        let penandaKelihatan = true;
        
        function togelPenanda() {
            const butangTogel = document.getElementById('btn-toggle-markers');
            const teksTogel = document.getElementById('teks-toggle');
            const iconHide = document.getElementById('icon-hide');
            const iconShow = document.getElementById('icon-show');
            const semuaPenanda = document.querySelectorAll('.marker-btn');

            penandaKelihatan = !penandaKelihatan;

            if (penandaKelihatan) {
                // Paparkan kembali penanda
                semuaPenanda.forEach(p => p.classList.remove('marker-hidden'));
                teksTogel.innerText = "Sembunyi Penanda";
                iconShow.classList.add('hidden');
                iconHide.classList.remove('hidden');
                butangTogel.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                butangTogel.classList.add('bg-slate-800', 'hover:bg-slate-700');
            } else {
                // Sembunyikan penanda
                semuaPenanda.forEach(p => p.classList.add('marker-hidden'));
                teksTogel.innerText = "Papar Penanda";
                iconHide.classList.add('hidden');
                iconShow.classList.remove('hidden');
                butangTogel.classList.remove('bg-slate-800', 'hover:bg-slate-700');
                butangTogel.classList.add('bg-blue-600', 'hover:bg-blue-700');
            }
        }

        // -------------------------------------------------------------------
        // 3. FUNGSI PAPAR MAKLUMAT (SweetAlert2)
        // -------------------------------------------------------------------
        function paparMaklumat(id) {
            const lokasi = pangkalanDataLokasi[id];
            
            if (!lokasi) {
                Swal.fire({
                    icon: 'error',
                    title: 'Ralat',
                    text: 'Maklumat lokasi tidak dijumpai.'
                });
                return;
            }

            let senaraiHtml = `<div class="text-left mt-3 bg-slate-50 p-4 rounded-lg border border-slate-100">`;
            senaraiHtml += `<h4 class="font-semibold text-slate-700 text-sm mb-3 border-b pb-2">Acara / Program di sini:</h4>`;
            senaraiHtml += `<ul class="space-y-2">`;
            
            lokasi.acara.forEach(item => {
                senaraiHtml += `
                    <li class="flex items-start text-sm text-slate-800">
                        <svg class="w-4 h-4 text-green-500 mt-0.5 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span>${item}</span>
                    </li>
                `;
            });
            
            senaraiHtml += `</ul></div>`;

            Swal.fire({
                title: `${lokasi.ikon} ${lokasi.nama}`,
                html: senaraiHtml,
                confirmButtonText: 'Tutup Maklumat',
                confirmButtonColor: '#3b82f6', // Tailwinds blue-600
                showClass: {
                    popup: 'animate__animated animate__fadeInUp animate__faster'
                },
                hideClass: {
                    popup: 'animate__animated animate__fadeOutDown animate__faster'
                },
                customClass: {
                    title: 'text-xl text-slate-800 font-bold',
                    popup: 'rounded-2xl shadow-2xl border border-slate-200'
                }
            });
        }
    </script>
</body>
</html>
